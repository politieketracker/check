      function plainText(value) {
        return String(value || "")
          .replace(/\*\*/g, "")
          .replace(/\*/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function metricPlainText(value) {
        return String(value || "")
          .replace(/\*\*/g, "")
          .replace(/\*/g, "")
          .replace(/\r\n?/g, "\n")
          .replace(/[ \t]+/g, " ")
          .replace(/\n{2,}/g, "\n")
          .trim();
      }

      function isMeaningfulText(value) {
        const text = plainText(value)
          .replace(/^[\s:;.,\-–—]+|[\s:;.,\-–—]+$/g, "")
          .trim();
        if (!text) return false;
        if (/^[A-Za-zÀ-ÿ ]{1,24}:?$/.test(text)) return false;
        return /[A-Za-zÀ-ÿ0-9]/.test(text) && text.length > 6;
      }

      /* a sentence ends at ". " / "." + end of text / a line break, but never at the dot inside a number such as 25.000 */
      function sentenceFromMatch(text, index) {
        const isEnd = i => text[i] === "\n" || (text[i] === "." && !(/\d/.test(text[i - 1] || "") && /\d/.test(text[i + 1] || "")));
        let start = -1;
        for (let i = index - 1; i >= 0; i--) { if (isEnd(i)) { start = i; break; } }
        let end = text.length;
        for (let i = index; i < text.length; i++) { if (isEnd(i)) { end = i; break; } }
        return text.slice(start + 1, end).trim();
      }

      function highlightFirstMetric(sentence, value) {
        const sentenceText = String(sentence || "");
        const metricText = String(value || "").trim();
        if (!sentenceText) return "";
        if (!metricText) return escapeHtml(sentenceText);
        const index = sentenceText.toLowerCase().indexOf(metricText.toLowerCase());
        if (index < 0) return escapeHtml(sentenceText);
        return `${escapeHtml(sentenceText.slice(0, index))}<strong>${escapeHtml(sentenceText.slice(index, index + metricText.length))}</strong>${escapeHtml(sentenceText.slice(index + metricText.length))}`;
      }

      function extractMetricItems(...values) {
        const text = plainText(values.filter(Boolean).join("\n"));
        if (!text) return [];

        const seen = new Set();
        const metrics = [];
        const metricRegex = /([+-]?\d{1,3}(?:[\s.]\d{3})*(?:[,.]\d+)?\s?%|[+-]?\d+(?:[,.]\d+)?\s?procent|\b\d{1,3}(?:[\s.]\d{3})+\b)/gi;
        let match;

        while ((match = metricRegex.exec(text)) && metrics.length < 4) {
          const value = match[1].replace(/\s+(?=%)/g, "");
          const normalized = value.toLowerCase();
          if (seen.has(normalized)) continue;
          seen.add(normalized);

          let sentence = cleanBulletText(sentenceFromMatch(text, match.index));
          let label = sentence.replace(match[1], "").replace(/^[\s:;,.\-–—]+|[\s:;,.\-–—]+$/g, "").trim();
          if (label.length > 115) label = label.slice(0, 112).replace(/\s+\S*$/, "") + "…";
          if (!label || /^[,:;\-–—]+$/.test(label)) label = "Kerncijfer uit de beoordeling";

          metrics.push({ value, label, sentence });
        }

        return metrics;
      }

      function renderMetricGrid(metrics) {
        if (!metrics.length) return "";
        return `
          <div class="pd-metric-panel">
            <h3 class="pd-metric-panel-title">Kerncijfers</h3>
            <div class="pd-metric-grid">
              ${metrics.map(item => `
                <article class="pd-metric-card">
                  <span class="pd-metric-value">${escapeHtml(item.value)}</span>
                  <span class="pd-metric-label">${escapeHtml(item.label)}</span>
                </article>
              `).join("")}
            </div>
          </div>
        `;
      }

      function renderEvidenceBlock(title, value) {
        if (!isMeaningfulText(value)) return "";
        return `
          <article class="pd-evidence-card">
            <h3 class="pd-evidence-title">${escapeHtml(title)}</h3>
            <div class="pd-fact-copy">${renderRichText(value)}</div>
          </article>
        `;
      }

      function renderEvidenceGrid(promise) {
        const outcome = getField(promise, PROMISE_FIELDS.uitkomst);
        const numbers = getField(promise, PROMISE_FIELDS.cijfers);
        const metrics = extractMetricItems(numbers, outcome);
        const outcomeBlock = renderEvidenceBlock(EVIDENCE_TITLE, outcome);
        const numbersFallback = !metrics.length ? renderEvidenceBlock("Cijfers", numbers) : "";
        const metricBlock = renderMetricGrid(metrics);
        const blocks = [outcomeBlock, metricBlock || numbersFallback].filter(Boolean);
        return blocks.length ? `<div class="pd-evidence-grid">${blocks.join("")}</div>` : "";
      }

      /* "BRUZZCheck beoordelingen": one dot per assessment round (every 6 months). A filled dot has the colour of
         the verdict this promise got in that round, an empty circle is a round that still has to be filled in. */
      let roundsInfo = { rounds: [], verdicts: [] };
      const ROUND_MONTHS = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

      /* the season of a date, as on the rest of the page: nov = herfst, mei = lente, etc. */
      function seasonName(date) {
        const m = date.getMonth();   // 0 = january
        if (m === 11 || m <= 1) return "winter";
        if (m <= 4) return "lente";
        if (m <= 7) return "zomer";
        return "herfst";
      }

      function roundList() {
        const verdicts = roundsInfo.verdicts || [];
        let rounds = (roundsInfo.rounds || []).map(round => ({ time: round.time, iso: round.iso, published: round.published }));
        if (!rounds.length) {
          // no Rondes table available: every 6 months from 15 November 2026 until November 2029
          for (let i = 0; i < 7; i++) {
            const d = new Date(2026, 10 + i * 6, 15);
            rounds.push({ time: d.getTime(), iso: bIso(d.getTime()), published: false });
          }
        }
        return rounds.map(round => {
          const verdict = verdicts.find(item => item.iso === round.iso);
          return Object.assign({}, round, { verdict, published: round.published || Boolean(verdict) });
        });
      }

      /* the agenda of "Redactionele aanpak": the same component as on the overview page */
      function renderMainAgenda() {
        const start = new Date("2026-02-01T00:00:00").getTime(), end = new Date("2029-09-15T00:00:00").getTime(), now = Date.now();
        const list = [];
        for (let y = 2026; y <= 2028; y++) for (const m of [4, 10]) { const d = new Date(y, m, 15); if (d >= new Date(2026, 10, 1)) list.push(d.getTime()); }
        list.push(new Date(2029, 4, 15).getTime());
        list.push(end);
        list.sort((a, b) => a - b);
        const rounds = list.map(t => { const d = new Date(t); return { t, past: t <= now + 5 * 86400000, season: seasonName(d), year: d.getFullYear() }; });
        const n = rounds.length, anchors = [start].concat(rounds.map(r => r.t));
        const pct = i => (i / n) * 100;
        const pos = t => {
          let k = 0; while (k < n && anchors[k + 1] <= t) k++;
          if (k >= n) return "100%";
          const a = anchors[k], b = anchors[k + 1];
          return (pct(k) + (Math.max(0, t - a) / (b - a)) * (pct(k + 1) - pct(k))).toFixed(2) + "%";
        };
        const posI = i => pct(i + 1).toFixed(2) + "%";
        let h = '<div class="pd-ag2-track"><span class="pd-ag2-fill"></span>';
        const labs = ['<span class="pd-ag2-lab pd-ag2-first" style="--pos:0%">feb<br><span class="pd-y2-f">2026</span><span class="pd-y2-s">\u201926</span></span>'];
        rounds.forEach((r, i) => {
          h += '<span class="pd-ag2-dot' + (r.past ? " is-past" : "") + '" style="--pos:' + posI(i) + '"></span>';
          labs.push('<span class="pd-ag2-lab' + (r.past ? " is-past" : "") + '" style="--pos:' + posI(i) + '">' + (i === 0 ? "nov" : r.season) + '<br><span class="pd-y2-f">' + r.year + '</span><span class="pd-y2-s">\u2019' + String(r.year).slice(2) + "</span></span>");
        });
        return '<div class="pd-agenda2" aria-hidden="true" style="--ag-fill:' + pos(now) + '">' + h + '</div><div class="pd-ag2-labs">' + labs.join("") + "</div></div>";
      }

      /* the half-yearly BRUZZCheck updates (15 Nov / 15 May until 15 May 2029) on a phone */
      function renderAgenda() {
        const start = new Date(2026, 1, 1).getTime(), end = new Date(2029, 8, 15).getTime(), now = Date.now();
        const rounds = [];
        for (let y = 2026; y <= 2028; y++) for (const m of [4, 10]) { const d = new Date(y, m, 15); if (d >= new Date(2026, 10, 1)) rounds.push(d.getTime()); }
        rounds.push(new Date(2029, 4, 15).getTime());
        rounds.push(end);
        const pos = t => (Math.max(0, Math.min(1, (t - start) / (end - start))) * 100).toFixed(2) + "%";
        let h = `<span class="pd-ag-fill" style="width:${pos(now)}"></span>`;
        let labs = `<span class="pd-ag-lab pd-ag-first" style="--pos:0%">feb<br>2026</span>`;
        rounds.forEach(t => {
          const d = new Date(t), past = t <= now + 5 * 86400000;
          h += `<span class="pd-ag-dot${past ? " is-past" : ""}" style="--pos:${pos(t)}"></span>`;
          labs += `<span class="pd-ag-lab" style="--pos:${pos(t)}">${seasonName(d)}<br>${d.getFullYear()}</span>`;
        });
        return `<div class="pd-agenda" aria-hidden="true">${h}</div><div class="pd-ag-labs" aria-hidden="true">${labs}</div>`;
      }

      /* the BRUZZCheck agenda: same timeline as the overview page, with the status symbol on every update that has a verdict */
      function renderRoundsTimeline() {
        const start = new Date("2026-02-01T00:00:00").getTime(), end = new Date("2029-09-15T00:00:00").getTime(), now = Date.now();
        const list = [];
        for (let y = 2026; y <= 2028; y++) for (const m of [4, 10]) { const d = new Date(y, m, 15); if (d >= new Date(2026, 10, 1)) list.push(d.getTime()); }
        list.push(new Date(2029, 4, 15).getTime());
        list.push(end);
        list.sort((x, y) => x - y);
        const known = roundList();
        const n = list.length, anchors = [start].concat(list);
        const pct = i => (i / n) * 100;
        const posOf = t => {
          let k = 0; while (k < n && anchors[k + 1] <= t) k++;
          if (k >= n) return "100%";
          const lo = anchors[k], hi = anchors[k + 1];
          return (pct(k) + (Math.max(0, t - lo) / (hi - lo)) * (pct(k + 1) - pct(k))).toFixed(2) + "%";
        };
        let h = '<div class="pd-ag2-track"><span class="pd-ag2-fill"></span>';
        const labs = ['<span class="pd-ag2-lab pd-ag2-first" style="--pos:0%">feb<br><span class="pd-y2-f">2026</span><span class="pd-y2-s">\u201926</span></span>'];
        list.forEach((t, i) => {
          const d = new Date(t), past = t <= now + 5 * 86400000, pos = pct(i + 1).toFixed(2) + "%";
          const match = known.find(r => Math.abs(r.time - t) < 20 * 86400000);
          const verdict = match && match.verdict;
          const conf = verdict ? STATUS_CONFIG[verdict.key] : null;
          const season = i === 0 ? "nov" : seasonName(d);
          const title = `${season} ${d.getFullYear()}${verdict ? ": " + verdict.label : ""}`;
          const lc = conf ? ((window.BRUZZ_SYM && window.BRUZZ_SYM.color) ? window.BRUZZ_SYM.color(conf) : conf.color) : "";
          if (conf) h += `<span class="pd-ag2-sym" style="--pos:${pos}" title="${escapeHtml(title)}">${(window.BRUZZ_SYM && window.BRUZZ_SYM.html) ? window.BRUZZ_SYM.html(conf) : renderSym(conf)}</span>`;
          else h += '<span class="pd-ag2-dot' + (past ? " is-past" : "") + '" style="--pos:' + pos + '" title="' + escapeHtml(title) + '"></span>';
          labs.push('<span class="pd-ag2-lab' + (past ? " is-past" : "") + (lc ? " has-c" : "") + '" style="--pos:' + pos + (lc ? ";--lc:" + lc : "") + '">' + season + '<br><span class="pd-y2-f">' + d.getFullYear() + '</span><span class="pd-y2-s">\u2019' + String(d.getFullYear()).slice(2) + "</span></span>");
        });
        return `
          <div class="pd-rounds">
            <h3 class="pd-rounds-title">Evaluatierondes van BRUZZCheck</h3>
            <div class="pd-agenda2" style="--ag-fill:${posOf(now)}">${h}</div><div class="pd-ag2-labs">${labs.join("")}</div></div>
          </div>
        `;
      }

      function renderRoundsTimelineOld() {
        const rounds = roundList();
        if (rounds.length < 2) return "";
        const first = rounds[0].time;
        const last = rounds[rounds.length - 1].time;
        const span = Math.max(1, last - first);
        const pos = time => Math.min(100, Math.max(0, (time - first) / span * 100));
        const today = Date.now();
        // coloured in until the last round that has a verdict
        const doneTimes = rounds.filter(round => round.verdict).map(round => round.time);
        const fill = doneTimes.length ? pos(Math.max(...doneTimes)) : 0;
        const nextIndex = rounds.findIndex(round => !round.published && round.time >= today - 86400000);
        const label = time => { const d = new Date(time); return `${seasonName(d)} ${d.getFullYear()}`; };

        const dots = rounds.map((round, index) => {
          const conf = round.verdict ? STATUS_CONFIG[round.verdict.key] : null;
          const state = round.verdict ? "done" : (index === nextIndex ? "next" : "todo");
          const title = round.verdict
            ? `${label(round.time)}: ${round.verdict.label}`
            : `${label(round.time)}: nog te beoordelen`;
          const vIndex = round.verdict ? (roundsInfo.verdicts || []).indexOf(round.verdict) : -1;
          const style = `--pos:${pos(round.time)}%;${conf ? ` --c:${conf.color};` : ""}`;
          if (vIndex >= 0) {
            return `<button type="button" class="pd-round pd-round--${state}${conf ? " pd-round--sym" : ""}" style="${style}" title="${escapeHtml(title)}" aria-label="Ga naar de beoordeling: ${escapeHtml(title)}" data-round-target="bm-timeline-status-${vIndex}">${conf ? renderSym(conf) : ""}</button>`;
          }
          return `<span class="pd-round pd-round--${state} pd-round--badge" style="${style}" title="${escapeHtml(title)}"></span>`;
        }).join("");

        const labels = rounds.map((round, index) => {
          const d = new Date(round.time);
          return `<span class="pd-round-label" style="--pos:${pos(round.time)}%">${seasonName(d)}<br>${d.getFullYear()}</span>`;
        }).join("");

        return `
          <div class="pd-rounds">
            <h3 class="pd-rounds-title">Volgende evaluaties van BRUZZCheck</h3>
            <div class="pd-rounds-shell">
              <div class="pd-rounds-track"><span class="pd-rounds-fill" style="width:${fill}%"></span>${dots}</div>
              <div class="pd-rounds-labels">${labels}</div>
            </div>
          </div>
        `;
      }

      /* ---------- carousel with other promises ---------- */
      let carouselPool = [];

      function carouselCards(current) {
        const key = promiseIdentity(current);
        const firstName = row => {
          const p = ministerPeople(getRawField(row, PROMISE_FIELDS.minister), getRawField(row, PROMISE_FIELDS.party))[0];
          return p ? p.name : "";
        };
        const mine = firstName(current);
        // start after the current promise, so every page shows a different row
        const at = carouselPool.findIndex(row => promiseIdentity(row) === key);
        const ordered = at >= 0 ? carouselPool.slice(at + 1).concat(carouselPool.slice(0, at)) : carouselPool.slice();
        const rotated = ordered.filter(row => getField(row, PROMISE_FIELDS.title) && promiseIdentity(row) !== key);
        const same = mine ? rotated.filter(row => firstName(row) === mine) : [];
        const rest = rotated.filter(row => !same.includes(row));
        const mix = list => { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        return mix(rotated).slice(0, CAROUSEL_COUNT);
      }

      function promiseIdentity(row) {
        return String(getPromiseKey(row) || row.id || "");
      }

8%22%20x2=%22152%22%20y2=%22234%22%20stroke=%22%23ff9db8%22%20stroke-width=%2215.600000000000001%22/%3E%3Ccircle%20cx=%22152%22%20cy=%2240%22%20r=%2222.4%22%20fill=%22%23ff9db8%22/%3E%3Ccircle%20cx=%2280%22%20cy=%2278%22%20r=%2224.9%22%20fill=%22%23ff9db8%22/%3E%3Ccircle%20cx=%22224%22%20cy=%2278%22%20r=%2224.9%22%20fill=%22%23ff9db8%22/%3E%3Ccircle%20cx=%22152%22%20cy=%22120%22%20r=%2228.9%22%20fill=%22%23ff9db8%22/%3E%3Ccircle%20cx=%2292%22%20cy=%22156%22%20r=%2222.4%22%20fill=%22%23ff9db8%22/%3E%3Ccircle%20cx=%22212%22%20cy=%22156%22%20r=%2222.4%22%20fill=%22%23ff9db8%22/%3E%3Ccircle%20cx=%22152%22%20cy=%22188%22%20r=%2224.4%22%20fill=%22%23ff9db8%22/%3E%3C/g%3E%3Cg%3E%3Cline%20x1=%22152%22%20y1=%2240%22%20x2=%2280%22%20y2=%2278%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22152%22%20y1=%2240%22%20x2=%22224%22%20y2=%2278%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22152%22%20y1=%2240%22%20x2=%22152%22%20y2=%22120%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%2280%22%20y1=%2278%22%20x2=%2292%22%20y2=%22156%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22224%22%20y1=%2278%22%20x2=%22212%22%20y2=%22156%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%2280%22%20y1=%2278%22%20x2=%22152%22%20y2=%22120%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22224%22%20y1=%2278%22%20x2=%22152%22%20y2=%22120%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22152%22%20y1=%22120%22%20x2=%2292%22%20y2=%22156%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22152%22%20y1=%22120%22%20x2=%22212%22%20y2=%22156%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22152%22%20y1=%22120%22%20x2=%22152%22%20y2=%22188%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%2292%22%20y1=%22156%22%20x2=%22152%22%20y2=%22188%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%22212%22%20y1=%22156%22%20x2=%22152%22%20y2=%22188%22%20stroke=%22%23fff%22%20stroke-width=%2212.4%22/%3E%3Cline%20x1=%2292%22%20y1=%22156%22%20x2=%2256%22%20y2=%22234%22%20stroke=%22%23fff%22%20stroke-width=%2212.8%22/%3E%3Cline%20x1=%22212%22%20y1=%22156%22%20x2=%22248%22%20y2=%22234%22%20stroke=%22%23fff%22%20stroke-width=%2212.8%22/%3E%3Cline%20x1=%22152%22%20y1=%22188%22%20x2=%22152%22%20y2=%22234%22%20stroke=%22%23fff%22%20stroke-width=%2212.8%22/%3E%3Ccircle%20cx=%22152%22%20cy=%2240%22%20r=%2221%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2280%22%20cy=%2278%22%20r=%2223.5%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%22224%22%20cy=%2278%22%20r=%2223.5%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%22152%22%20cy=%22120%22%20r=%2227.5%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2292%22%20cy=%22156%22%20r=%2221%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%22212%22%20cy=%22156%22%20r=%2221%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%22152%22%20cy=%22188%22%20r=%2223%22%20fill=%22%23fff%22/%3E%3C/g%3E%3C/svg%3E")'>${balls}</span></span>`;
      }

      function renderCarousel(current) {
        if (!CAROUSEL_COUNT) return "";
        const cards = carouselCards(current);
        if (!cards.length) return "";

        const items = cards.map(row => {
          const title = getField(row, PROMISE_FIELDS.title).replace(/[“”"]/g, "").trim();
          const conf = statusConfigFor(row);
          const key = statusKey(getField(row, PROMISE_FIELDS.status));
          const image = getImageField(row, PROMISE_FIELDS.heroImage);
          const emoji = getField(row, PROMISE_FIELDS.emoji);
          const url = getField(row, PROMISE_FIELDS.detailUrl).trim();
          const media = image
            ? `<span class="pd-car-media" data-emoji="${escapeHtml(emoji || "")}"><img src="${escapeHtml(image)}" alt="" loading="lazy" decoding="async"></span>`
            : `<span class="pd-car-media pd-car-media--empty" aria-hidden="true">${escapeHtml(emoji || "")}</span>`;
          const body = `
              ${media}
              <span class="pd-car-title">${escapeHtml(title)}</span>`;
          return url
            ? `<a class="pd-car-card" href="${escapeHtml(url)}">${body}</a>`
            : `<div class="pd-car-card pd-car-card--static">${body}</div>`;
        }).join("");

        return `
          <section class="pd-section pd-car" aria-label="${escapeHtml(CAROUSEL_TITLE)}">
            <div class="pd-section-head pd-car-head">
              <h2 class="pd-section-title">Ontdek de andere beloftes<span class="pd-car-of"> van <span class="pd-back-logo pd-car-logo" role="img" aria-label="BRUZZCheck" style="-webkit-mask-image:url(${PD_LOGO});mask-image:url(${PD_LOGO})"></span></span></h2>
              <div class="pd-car-arrows">
                <button type="button" class="pd-car-arrow pd-car-prev" data-car-dir="-1" aria-label="Vorige" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <button type="button" class="pd-car-arrow" data-car-dir="1" aria-label="Volgende"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              </div>
            </div>
            <div class="pd-car-track" tabindex="0" lang="nl"><a class="pd-car-card pd-car-main" href="${escapeHtml(OVERVIEW_URL)}">${atomMedia()}<span class="pd-car-title">BRUZZCheck<br>hoofdpagina</span></a>${items}</div>
          </section>
        `;
      }

      /* arrows scroll the track by about one screen of cards; an arrow is disabled at the start and the end */
      function updateCarouselArrows(track) {
        const box = track.closest(".pd-car");
        if (!box) return;
        const prev = box.querySelector('[data-car-dir="-1"]');
        const next = box.querySelector('[data-car-dir="1"]');
        if (prev) prev.disabled = track.scrollLeft <= 2;
        if (next) next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
      }

      root.addEventListener("click", function (event) {
        const arrow = event.target.closest("[data-car-dir]");
        if (!arrow) return;
        const track = arrow.closest(".pd-car").querySelector(".pd-car-track");
        track.scrollBy({ left: Number(arrow.getAttribute("data-car-dir")) * track.clientWidth * 0.85, behavior: "smooth" });
      });

      function setupCarousel() {
        root.querySelectorAll(".pd-car-track").forEach(track => {
          updateCarouselArrows(track);
          track.addEventListener("scroll", () => updateCarouselArrows(track), { passive: true });
        });
        window.addEventListener("resize", () => root.querySelectorAll(".pd-car-track").forEach(updateCarouselArrows));
      }

      function renderVerdictEvidence(promise, asOf) {
        const dateHtml = ""; /* the date now sits in the "Status op ..." heading */
        const metrics = extractMetricItems(
          getField(promise, PROMISE_FIELDS.cijfers),
          getField(promise, PROMISE_FIELDS.uitkomst)
        ).slice(0, 3);

        const outcome = getField(promise, PROMISE_FIELDS.uitkomst);

        // show the whole Uitkomst/Bewijs text (all bullets) under the verdict; only fall back to the short list of figures when there is no text
        if (isMeaningfulText(outcome) || !metrics.length) {
          if (!isMeaningfulText(outcome)) return "";
          return `
          <div class="pd-verdict-evidence">
            <div class="pd-verdict-evidence-head"><h3 class="pd-verdict-evidence-title">${escapeHtml(EVIDENCE_TITLE)}</h3>${dateHtml}</div>
            <div class="pd-verdict-evidence-text">${renderRichText(outcome)}</div>
          </div>
        `;
        }

        return `
          <div class="pd-verdict-evidence">
            <div class="pd-verdict-evidence-head"><h3 class="pd-verdict-evidence-title">Waarom deze status?</h3>${dateHtml}</div>
            <ul class="pd-verdict-evidence-list">
              ${metrics.map(item => `<li>${highlightFirstMetric(item.sentence || `${item.value} ${item.label}`, item.value)}</li>`).join("")}
            </ul>
          </div>
        `;
      }

      function renderSummaryItem(label, value) {
        if (!value) return "";
        return `
          <div class="pd-summary-item">
            <span class="pd-summary-label">${escapeHtml(label)}</span>
            <span class="pd-summary-value">${escapeHtml(value)}</span>
          </div>
        `;
      }

      function renderPage(promise, updates) {
        const host = $("pdRoot");
        const conf = statusConfigFor(promise);
        const status = statusKey(getField(promise, PROMISE_FIELDS.status));
        const latestUpdate = getLatestUpdate(updates);

        root.style.setProperty("--pd-status-color", conf.color);
        root.style.setProperty("--pd-status-bg", conf.bg);
        /* white text on the teal "Gelukt" header; other statuses pick black or white by contrast */
        const WHITE_TEXT_ON = ["GELUKT", "NIET GESTART", "ONVERIFIEERBAAR"];
        const onColor = WHITE_TEXT_ON.includes(status) ? "#FFFFFF" : onColorFor(conf.color);
        root.style.setProperty("--pd-on-status", onColor);

        const promiseTitle = getField(promise, PROMISE_FIELDS.title);
        const plainTitle = promiseTitle.replace(/[“”"]/g, "").trim();
        const titleClass = plainTitle.length > 44 ? "pd-title pd-title-long" : "pd-title";
        const emoji = getField(promise, PROMISE_FIELDS.emoji);
        const people = ministerPeople(getRawField(promise, PROMISE_FIELDS.minister), getRawField(promise, PROMISE_FIELDS.party));
        const avatarOf = p => p.person
          ? `<img class="pd-hero-avatar" src="${escapeHtml(p.person.image)}" alt="" loading="lazy">`
          : renderIcon("person");
        const personText = p => `<span class="pd-mn">${escapeHtml(p.name)}</span>` + (p.party ? ` <span class="pd-mp">(${escapeHtml(p.party)})</span>` : "");
        /* "Minister" or "Staatssecretaris", depending on the person */
        const isStaatssec = p => Boolean(p.person && /staatssecretaris/i.test(String(p.person.centerKicker || "")));
        const roleLabel = people.length > 1
          ? (people.every(isStaatssec) ? "Staatssecretarissen" : people.some(isStaatssec) ? "Ministers en staatssecretarissen" : "Ministers")
          : (people.length === 1 && isStaatssec(people[0]) ? "Staatssecretaris" : "Minister");
        // one minister: photo next to the label and name; several: a list with a photo for each, below each other
        const ministerBlock = people.length ? `
                    <div class="pd-people">
                      <button type="button" class="pd-people-btn" aria-expanded="false" aria-controls="pd-people-list" aria-label="${people.length > 1 ? "Toon de verantwoordelijken" : "Toon de verantwoordelijke"}">
                        <span class="pd-avatar-stack">${people.map(avatarOf).join("")}</span>
                      </button>
                      <ul class="pd-minister-list pd-people-list" id="pd-people-list" hidden>
                        ${people.map(p => `<li class="pd-minister-row">${avatarOf(p)}<span class="pd-hero-detail-value">${personText(p)}</span></li>`).join("")}
                      </ul>
                    </div>` : "";
        const theme = getField(promise, PROMISE_FIELDS.theme);
        const promisedDate = formatDate(getField(promise, PROMISE_FIELDS.datePromised));
        const deadline = getField(promise, PROMISE_FIELDS.deadlinePromised);
        const dossierUrl = getField(promise, PROMISE_FIELDS.dossier);
        const sourceLabel = getField(promise, PROMISE_FIELDS.sourceLabel) || "Brontekst";
        const sourceTitle = getField(promise, PROMISE_FIELDS.sourceTitle);
        const sourceDateRaw = getField(promise, PROMISE_FIELDS.sourceDate) || getField(promise, PROMISE_FIELDS.datePromised);
        const sourceDate = formatDate(sourceDateRaw) || sourceDateRaw;
        const sourceUrl = getField(promise, PROMISE_FIELDS.sourceUrl) || dossierUrl;
        const sourceName = sourceTitle ? [sourceTitle, sourceDate ? `(${sourceDate})` : ""].filter(Boolean).join(" ") : sourceUrl;
        const heroImageUrl = getImageField(promise, PROMISE_FIELDS.heroImage);
        const heroFocus = imageFocusPosition(getField(promise, PROMISE_FIELDS.heroImageFocus));
        const heroStyle = heroImageUrl
          ? `--pd-hero-image:url(&quot;${escapeCssUrl(heroImageUrl)}&quot;); --pd-image-focus:${escapeHtml(heroFocus)};`
          : `--pd-image-focus:center center;`;
        const promiseFactsHtml = renderPromiseFacts(promise);
        /* "Stand op 15 nov 2026": the date of the latest verdict of this promise */
        const verdictTimes = roundList().filter(r => r.verdict).map(r => r.time);
        const verdictAsOf = verdictTimes.length ? formatTimelineLabel(Math.max(...verdictTimes)).replace(/\./g, "") : "";
        const verdictBody = getField(promise, PROMISE_FIELDS.verdict)
          || getField(latestUpdate || {}, ["Update tekst uitklap", "Context", "Detail text"])
          || getField(promise, PROMISE_FIELDS.shortDescription);
        const latestDate = getVerdictDate(promise, updates)
          || formatDate(getField(promise, PROMISE_FIELDS.lastUpdated))
          || (latestUpdate ? formatDate(latestUpdate["Update date"]) : "");
        const nextDate = formatMaybeDate(listValues(getColumn(promise, "volgendebeoordeling")).join(", ") || getField(promise, PROMISE_FIELDS.nextUpdate));
        const journalists = listValues(getColumn(promise, "journalist"));
        // "minister Elke Van den Brandt", "staatssecretaris Audrey Henry", or "minister A en staatssecretaris B"
        const executedByText = joinNames(people.map(p => {
          const role = p.person && p.person.centerKicker ? p.person.centerKicker.toLowerCase() : "";
          return `${role ? role + " " : ""}<strong>${escapeHtml(p.name)}</strong>`;
        }));
        const assessmentText = (latestDate
          ? `De laatste beoordeling was op <strong>${escapeHtml(latestDate)}</strong>.`
          : "Er is nog geen beoordeling geweest.")
          + (nextDate ? ` De volgende staat gepland op <strong>${escapeHtml(nextDate)}</strong>.` : "");
        // The old compact status summary strip is intentionally not rendered anymore.
        // Status/date/control details now live inside the verdict card.

        $("pdBackLink").href = OVERVIEW_URL;

        const pollKey = getPromiseKey(promise) || String(promise.id || "");
        const pollVoted = hasVotedOn(pollKey);
        const pollOwn = pollConfigOf(promise);
        if (pollOwn) pollCfg[pollKey] = pollOwn;
        const hasPoll = Boolean(POLL_TALLY_ID || pollOwn);
        const pollMarkup = hasPoll ? pollMarkupFor(pollKey, pollVoted) : "";

        host.innerHTML = `
          <section class="pd-hero" aria-labelledby="pd-title">
            <div class="pd-hero-left">
            <div class="pd-promise-panel${hasPoll ? " pd-has-poll" : ""}" style="${heroStyle}${hasPoll ? ` --pd-overlay:${POLL_OVERLAY};` : ""}">
              ${(!heroImageUrl && emoji) ? `<span class="pd-hero-emoji" aria-hidden="true">${escapeHtml(emoji)}</span>` : ""}
              <div class="pd-promise-content">
                <h1 class="${titleClass}" id="pd-title">${escapeHtml(plainTitle)}</h1>
                ${ministerBlock ? `<div class="pd-hero-top pd-hero-people">${ministerBlock}</div>` : ""}
                <div class="pd-hero-bottom">

          if (window.matchMedia("(hover: hover)").matches) box.addEventListener("mouseout", e => { const d = e.target.closest && e.target.closest(".pd-im-pin"); if (d && d.dataset.key) setOn(d.dataset.key, false); });
        }
        box.addEventListener("click", e => {
          const d = e.target.closest && e.target.closest(".pd-im-pin");
          if (d && d.dataset.key) { if (canHover) setOn(d.dataset.key, true); else setOn(d.dataset.key, !d.classList.contains("is-on")); }
          else Object.keys(inlineMapObj.markers).forEach(k => inlineMapObj.markers[k].classList.remove("is-on"));
        });
        box.addEventListener("click", e => {
          const zb = e.target.closest && e.target.closest(".pd-map-zoom button");
          if (!zb) return;
          e.stopPropagation();
          const m = inlineMapObj.map; if (!m || !m.getZoom) return;
          const base = typeof inlineMapObj.base === "number" ? inlineMapObj.base : m.getZoom();
          const to = Math.max(base, Math.min(base + 3, Math.round(m.getZoom()) + Number(zb.dataset.z)));   // a few levels: the first view up to 3 closer
          Object.keys(inlineMapObj.markers).forEach(k => inlineMapObj.markers[k].classList.remove("is-on"));
          m.easeTo({ zoom: to, duration: 250 });
        }, true);
        btn.addEventListener("click", () => {
          const open = box.hidden;
          box.hidden = !open;
          btn.setAttribute("aria-expanded", String(open));
          btn.textContent = open ? "Verberg kaart" : "Kaart";
          if (open) { if (!built) build(); else if (inlineMapObj.map) { inlineMapObj.map.resize(); } }
        });
      }
      let placesWired = false;
      function wirePlaces() {
        if (placesWired) return; placesWired = true;
        const canHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
        root.addEventListener("click", e => {
          const b = e.target.closest && e.target.closest(".pd-place");
          if (b && inlineActive()) { e.preventDefault(); return; }
          if (b) { e.preventDefault(); if (placeEl === b && placePinned) hidePlace(); else showPlace(b, true); return; }
        });
        document.addEventListener("click", e => { if (placePop && !placePop.hidden && !e.target.closest(".pd-place-pop, .pd-place")) hidePlace(); });
        document.addEventListener("keydown", e => { if (e.key === "Escape") hidePlace(); });
        window.addEventListener("scroll", () => { if (placeEl && placePop && !placePop.hidden) positionPlace(placeEl, placePop); }, { passive: true });
      }

      /* party names in the "De belofte uitgelegd" block get their party colour ("EDMR" is not "MR") */
      const PARTY_INK = { "MR": "#3f6fcf", "Anders": "#3f6fcf", "Les Engagés": "#1ea5b8", "Les Engages": "#1ea5b8", "Groen": "#2c9a35", "Vooruit": "#e6002f", "PS": "#e6002f" };
      function colourParties() {
        const re = /(^|[^\p{L}\p{N}_])(Les Engag[ée]s|Vooruit|Groen|Anders|MR|PS)(?![\p{L}\p{N}_])/gu;
        root.querySelectorAll(".pd-promise-overview-box").forEach(scope => {
          const nodes = [], walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT);
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach(node => {
            if (node.parentElement.closest("a, button, .pd-party")) return;
            const text = node.nodeValue; re.lastIndex = 0;
            let m, last = 0, frag = null;
            while ((m = re.exec(text))) {
              const start = m.index + m[1].length, after = text.slice(start + m[2].length);
              if (m[2] === "Anders") {
                const before = text.slice(0, start).replace(/\s+$/, "");
                const atSentenceStart = !before || /[.!?:]$/.test(before);
                if (atSentenceStart && !/^\s*(,|\/|en\b|of\b)\s*(MR|PS|Groen|Vooruit|Les Engag)/.test(after)) continue;
              }
              frag = frag || document.createDocumentFragment();
              frag.appendChild(document.createTextNode(text.slice(last, start)));
              const sp = document.createElement("span");
              sp.className = "pd-party"; sp.style.color = PARTY_INK[m[2]] || PARTY_INK["Les Engagés"]; sp.style.fontWeight = "500";
              sp.textContent = m[2]; frag.appendChild(sp); last = start + m[2].length;
            }
            if (frag) { frag.appendChild(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(frag, node); }
          });
        });
      }

      /* "BRUZZCheck" is written "BRUZZCheck" everywhere, also in text that comes from Baserow */
      function fixBrand() {
        const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const hit = [];
        while (w.nextNode()) if (/BRUZZ\s+Check/i.test(w.currentNode.nodeValue)) hit.push(w.currentNode);
        hit.forEach(n => { n.nodeValue = n.nodeValue.replace(/BRUZZ\s+Check/gi, "BRUZZCheck"); });
        root.querySelectorAll("[aria-label],[title],[alt]").forEach(el => ["aria-label", "title", "alt"].forEach(a => { const v = el.getAttribute(a); if (v && /BRUZZ\s+Check/i.test(v)) el.setAttribute(a, v.replace(/BRUZZ\s+Check/gi, "BRUZZCheck")); }));
      }
      function italicBrand() {
        const skip = "a, button, h1, h2, h3, h4, .pd-hero, .pd-car, .pd-back, .pd-bc, .pd-gloss-pop, script, style";
        root.querySelectorAll("p, li").forEach(el => {
          if (el.closest(skip)) return;
          const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), hit = [];
          while (w.nextNode()) { const n = w.currentNode; if (n.nodeValue.indexOf("BRUZZCheck") > -1 && !n.parentElement.closest(skip)) hit.push(n); }
          hit.forEach(n => {
            const parts = n.nodeValue.split("BRUZZCheck"), f = document.createDocumentFragment();
            parts.forEach((p, i) => { if (i) { const e = document.createElement("i"); e.className = "pd-bc"; e.textContent = "BRUZZCheck"; f.appendChild(e); } f.appendChild(document.createTextNode(p)); });
            n.parentNode.replaceChild(f, n);
          });
        });
      }
      function watchBrand() {
        const run = () => { try { fixBrand(); italicBrand(); } catch (e) { /* cosmetic only */ } };
        run(); [600, 1800, 4500, 9000].forEach(t => setTimeout(run, t));
      }

      function applyGlossary(entries) {
        glossaryEntries = entries || [];
        const matcher = buildGlossaryMatcher(glossaryEntries);
        if (!matcher) return 0;

        let marked = 0;
        GLOSSARY_SCOPES.forEach(selector => {
          root.querySelectorAll(selector).forEach(scope => {
            const seen = new Set();   // "first time in this section" is counted per section
            const nodes = [];
            const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
              acceptNode: node => (node.nodeValue.trim() && !node.parentElement.closest("a, button, script, style, h1, h2, h3, .pd-gloss, .pd-terms"))
                ? NodeFilter.FILTER_ACCEPT
                : NodeFilter.FILTER_REJECT
            });
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(node => { marked += markTextNode(node, matcher, seen); });
          });
        });
        return marked;
      }

      /* ---- the card with the meaning ---- */
      let glossPop = null;
      let glossTimer = null;
      let glossTerm = null;
      let glossPinned = false;

      function glossPopover() {
        if (glossPop) return glossPop;
        glossPop = document.createElement("div");
        glossPop.className = "pd-gloss-pop"; glossPop.lang = "nl";
        glossPop.id = "pdGlossPop";
        glossPop.setAttribute("role", "tooltip");
        glossPop.hidden = true;
        root.appendChild(glossPop);
        glossPop.addEventListener("mouseenter", () => clearTimeout(glossTimer));
        glossPop.addEventListener("mouseleave", () => scheduleHideGloss());
        return glossPop;
      }

      function positionGloss(term, pop) {
        const rootRect = root.getBoundingClientRect();
        const t = term.getClientRects()[0] || term.getBoundingClientRect();
        const w = pop.offsetWidth;
        const h = pop.offsetHeight;
        const centre = t.left - rootRect.left + t.width / 2;
        const left = Math.min(Math.max(8, centre - w / 2), Math.max(8, rootRect.width - w - 8));
        const above = t.top - h - 12 >= 8;   // enough room above the word on screen?
        pop.style.left = left + "px";
        pop.style.top = (above ? t.top - rootRect.top - h - 12 : t.bottom - rootRect.top + 12) + "px";
        pop.dataset.side = above ? "above" : "below";
        pop.style.setProperty("--pd-arrow-x", Math.min(Math.max(18, centre - left), Math.max(18, w - 18)) + "px");
      }

      function showGloss(term, pinned) {
        const entry = glossaryEntries[Number(term.dataset.gloss)];
        if (!entry) return;
        clearTimeout(glossTimer);
        if (glossTerm && glossTerm !== term) {
          glossTerm.setAttribute("aria-expanded", "false");
          glossTerm.removeAttribute("aria-describedby");
        }
        glossTerm = term;
        glossPinned = Boolean(pinned);

        const pop = glossPopover();
        pop.classList.remove("pd-hint");
        pop.innerHTML = `
          <div class="pd-gloss-pop-word">${escapeHtml(entry.word)}</div>
          <div class="pd-gloss-pop-text">${renderRichText(entry.meaning)}</div>
        `;
        pop.style.left = "0px";
        pop.style.top = "0px";
        pop.hidden = false;
        term.setAttribute("aria-expanded", "true");
        term.setAttribute("aria-describedby", "pdGlossPop");
        positionGloss(term, pop);
      }

      function hideGloss() {
        clearTimeout(glossTimer);
        if (glossPop) glossPop.hidden = true;
        if (glossTerm) {
          glossTerm.setAttribute("aria-expanded", "false");
          glossTerm.removeAttribute("aria-describedby");
        }
        glossTerm = null;
        glossPinned = false;
      }

      function scheduleHideGloss() {
        clearTimeout(glossTimer);
        if (glossPinned) return;
        glossTimer = setTimeout(hideGloss, 160);
      }

      root.addEventListener("mouseover", event => {
        const term = event.target.closest(".pd-gloss");
        if (term && !glossPinned) showGloss(term, false);
        if (event.target.closest(".pd-gloss-pop")) clearTimeout(glossTimer);
      });

      root.addEventListener("mouseout", event => {
        if (!event.target.closest(".pd-gloss, .pd-gloss-pop")) return;
        const next = event.relatedTarget && event.relatedTarget.closest ? event.relatedTarget.closest(".pd-gloss, .pd-gloss-pop") : null;
        if (!next) scheduleHideGloss();
      });

      root.addEventListener("focusin", event => {
        const term = event.target.closest(".pd-gloss");
        if (term && !glossPinned) showGloss(term, false);
      });

      root.addEventListener("focusout", event => {
        if (event.target.closest(".pd-gloss")) scheduleHideGloss();
      });

      root.addEventListener("click", event => {
        const term = event.target.closest(".pd-gloss");
        if (!term) return;
        event.preventDefault();
        if (glossTerm === term && glossPinned) hideGloss();
        else showGloss(term, true);
      });

      root.addEventListener("keydown", event => {
        const term = event.target.closest(".pd-gloss");
        if (event.key === "Escape") {
          const was = glossTerm;
          hideGloss();
          if (was) was.focus();
          return;
        }
        if (term && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          if (glossTerm === term && glossPinned) hideGloss();
          else showGloss(term, true);
        }
      });

      document.addEventListener("click", event => {
        if (!event.target.closest(".pd-gloss, .pd-gloss-pop")) hideGloss();
      });

      window.addEventListener("resize", hideGloss);

      /* ===================================================================
         PAGE HEADER (see COVER_PAGE_HEADER)
         =================================================================== */
      let pageHeaderLogged = false;
      function noteAboutPageHeader(message) {
        if (!pageHeaderLogged) console.info("BRUZZCheck: " + message);
        pageHeaderLogged = true;
      }

      function hidePageHeader() {
        if (!COVER_PAGE_HEADER) return;
        const hide = el => {
          el.style.setProperty("display", "none", "important");
          el.setAttribute("data-pd-hidden", "");
        };
        const isAboveEmbed = el => el !== root && !root.contains(el) && !el.contains(root)
          && Boolean(root.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_PRECEDING);

        // step 1: the blocks you named, when they sit above the embed
        let count = 0;
        PAGE_HEADER_SELECTORS.forEach(selector => {
          document.querySelectorAll(selector).forEach(el => {
            if (!isAboveEmbed(el)) return;
            hide(el);
            count++;
          });
        });
        if (count) {
          noteAboutPageHeader(`${count} blok(ken) van de paginakop verborgen`);
          return;
        }

        // step 2: look for the title block ourselves
        const main = root.closest("main");
        const title = [...document.querySelectorAll("h1")].find(h =>
          isAboveEmbed(h) && (!main || main.contains(h)));
        if (!title) return;

        let start = title;
        while (start.parentElement && !start.parentElement.contains(root)) start = start.parentElement;
        const shared = start.parentElement;
        if (!shared) return;
        let end = root;
        while (end.parentElement && end.parentElement !== shared) end = end.parentElement;
        if (end.parentElement !== shared || end === start) return;
        if (!(start.compareDocumentPosition(end) & Node.DOCUMENT_POSITION_FOLLOWING)) return;

        const blocks = [];
        for (let el = start; el && el !== end; el = el.nextElementSibling) blocks.push(el);

        // Inside <main> a menu is most likely a breadcrumb or the share buttons, so that is allowed there.
        // Outside <main> a menu is probably the site navigation, so the page is left alone.
        const textLength = blocks.reduce((sum, el) => sum + el.textContent.trim().length, 0);
        const hasForm = blocks.some(el => el.matches("form, main, article") || el.querySelector("form, main, article, input, select"));
        const hasSiteMenu = !main && blocks.some(el => el.matches("nav") || el.querySelector("nav"));
        if (hasForm || hasSiteMenu || textLength > (main ? 600 : 400)) {
          noteAboutPageHeader("de paginakop is niet verborgen omdat die er niet uitziet als alleen titel, datum en deelknoppen. Voeg de klasse van het blok toe aan PAGE_HEADER_SELECTORS.");
          return;
        }
        blocks.forEach(hide);
        noteAboutPageHeader(`${blocks.length} blok(ken) van de paginakop automatisch verborgen`);
      }

      function pullEmbedUp() {
        if (!COVER_PAGE_HEADER || !REMOVE_SPACE_ABOVE_EMBED) return;
        root.style.marginTop = "";                      // measure from the natural position
        const content = root.closest("main");
        if (!content) return;

        const scrollY = window.pageYOffset || 0;
        let anchor = content.getBoundingClientRect().top + scrollY;
        document.querySelectorAll("header, nav, [data-header]").forEach(el => {
          if (el.contains(root)) return;
          const box = el.getBoundingClientRect();
          if (getComputedStyle(el).position === "fixed" && box.height > 0 && box.top < 8) {
            anchor = Math.max(anchor, box.bottom);       // a fixed bar stays on screen: stop below it
          }
        });

        const gap = Math.round(root.getBoundingClientRect().top + scrollY - anchor);
        if (gap > 1) {
          root.style.marginTop = `-${gap}px`;
          noteAboutSpace(`${gap}px lege ruimte boven de embed weggehaald`);
        }
      }

      let spaceLogged = false;
      function noteAboutSpace(message) {
        if (!spaceLogged) console.info("BRUZZCheck: " + message);
        spaceLogged = true;
      }

      /* One vote per promise: after a submission the browser remembers that promise (localStorage), so the same
         reader can still vote on the other promises. This is a convenience, not a lock: it is per browser. */
      const POLL_STORAGE_PREFIX = "bruzzcheck-voted-";
      function hasVotedOn(key) {
        try { return localStorage.getItem(POLL_STORAGE_PREFIX + key) === "1"; } catch (_) { return false; }
      }
      function forgetVote(key) {
        try { localStorage.removeItem(POLL_STORAGE_PREFIX + key); } catch (_) {}
      }
      function rememberVote(key) {
        try { localStorage.setItem(POLL_STORAGE_PREFIX + key, "1"); } catch (_) {}
      }

      window.addEventListener("message", function (event) {
        if (!event.origin || !/^https:\/\/tally\.so$/.test(event.origin)) return;
        let data = event.data;
        if (typeof data === "string") { try { data = JSON.parse(data); } catch (_) { return; } }
        if (!data || data.event !== "Tally.FormSubmitted") return;
        const frame = root.querySelector(".pd-poll iframe");
        if (!frame || frame.contentWindow !== event.source) return;
        const match = /[?&]promise=([^&]*)/.exec(frame.getAttribute("src") || frame.dataset.tallySrc || "");
        if (match) {
          const key = decodeURIComponent(match[1]);
          rememberVote(key);
          const card = frame.closest(".pd-poll");
          if (POLL_SHOW_RESULTS && card) {
            card.outerHTML = pollMarkupFor(key, "fresh");
            const done = root.querySelector(".pd-poll-done");
            if (done) loadPollResults(done, key, [1500, 2500, 4000, 6000, 8000, 10000, 15000], true);   // the webhook needs a moment to count the new vote
          }
        }
      });

      /* The own poll of a promise: { label, options } from its Baserow row, or null (then the Tally form is used). */
      const pollCfg = {};
      function pollConfigOf(promise) {
        const label = getField(promise, ["Poll vraag"]);
        if (!label) return null;
        const options = getField(promise, ["Poll antwoorden"]).split(/[\n;]+/).map(s => s.trim()).filter(Boolean);
        return { label, options: options.length ? options : POLL_DEFAULT_ANSWERS.slice() };
      }

      /* Results: ask the Worker, and try again a few times because the vote may not be counted yet. */
      /* "25/11/26, 11:06": the moment these numbers were fetched */
      /* the last results seen are kept in this browser, so the next visit shows numbers at once (and refreshes them behind the scenes) */
      const POLL_CACHE_PREFIX = "bruzzcheck-pollcache-";
      function readPollCache(key) {
        try {
          const c = JSON.parse(localStorage.getItem(POLL_CACHE_PREFIX + key) || "null");
          return c && c.result && c.result.enough && Date.now() - c.t < 7 * 864e5 ? c : null;
        } catch (_) { return null; }
      }
      function writePollCache(key, result) {
        try { if (result && result.enough) localStorage.setItem(POLL_CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), result })); } catch (_) {}
      }
      /* puts results into a poll card, over the "Resultaten laden..." line or over older numbers */
      function putPollHtml(card, html) {
        const box = card.querySelector(".pd-pr"), th = card.querySelector(".pd-poll-thanks");
        if (box) box.outerHTML = html; else if (th) th.outerHTML = html;
      }
      function pollStamp(ms) {
        const t = new Date(ms || Date.now()), two = n => String(n).padStart(2, "0");
        return `${two(t.getDate())}/${two(t.getMonth() + 1)}/${String(t.getFullYear()).slice(-2)}, ${two(t.getHours())}:${two(t.getMinutes())}`;
      }
      function pollBars(result, key, when) {
        const counts = result.questions || {};
        const norm = text => String(text).trim().toLowerCase();
        /* questions from the settings */
        const known = (pollCfg[key] ? [pollCfg[key]] : POLL_QUESTIONS).map(question => ({ label: question.label, options: question.options }));
        /* only the questions listed in POLL_QUESTIONS are shown: old test votes under another question text stay hidden */
        const blocks = known.map(question => {
          const found = Object.keys(counts).find(label => norm(label) === norm(question.label));
          const answers = found ? counts[found] : {};
          const order = question.options.concat(Object.keys(answers).filter(a => !question.options.some(o => norm(o) === norm(a))));
          const total = order.reduce((sum, option) => {
            const hit = Object.keys(answers).find(a => norm(a) === norm(option));
            return sum + (hit ? answers[hit] : 0);
          }, 0);
          if (!total) return "";
          const rows = order.map(option => {
            const hit = Object.keys(answers).find(a => norm(a) === norm(option));
            const n = hit ? answers[hit] : 0;
            const pct = Math.round(n / total * 100);
            return `<div class="pd-pr-row" data-answer="${escapeHtml(option)}"><span class="pd-pr-name">${escapeHtml(option)}</span><span class="pd-pr-bar"><i style="width:${pct}%"></i></span><span class="pd-pr-pct">${pct}%</span></div>`;
          }).join("");
          return `<div class="pd-pr-q"><p class="pd-pr-title">${escapeHtml(question.label)}</p>${rows}</div>`;
        }).join("");
        return blocks ? `<div class="pd-pr">${blocks}<p class="pd-pr-note">${result.votes} ${result.votes === 1 ? "stem" : "stemmen"} (niet representatief) <span class="pd-pr-op">op ${pollStamp(when)}</span></p></div>` : "";
      }

      async function loadPollResults(card, key, delays, justVoted) {
        if (!card.querySelector(".pd-poll-thanks") && !card.querySelector(".pd-pr")) return;
        const waiting = "Resultaten laden...";
        let lastError = "";
        let lastVotes = null;   // votes the Worker reported on the last successful answer
        for (let attempt = 0; attempt <= delays.length; attempt++) {
          if (attempt > 0) await new Promise(resolve => setTimeout(resolve, delays[attempt - 1]));
          if (!document.body.contains(card)) return;
          try {
            let result = null;
            if (attempt === 0 && earlyPoll && earlyPoll.key === key) result = await earlyPoll.promise;   // already on its way
            if (!result) {
              const res = await fetch(`${API_BASE_URL.replace(/\/$/, "")}/poll-results?promise=${encodeURIComponent(key)}${attempt > 0 || delays[0] === 0 ? "&fresh=1" : ""}`);
              if (!res.ok) throw new Error("status " + res.status);
              result = await res.json();
            }
            lastVotes = result && typeof result.votes === "number" ? result.votes : null;
            if (result && result.enough) {
              const html = pollBars(result, key);
              writePollCache(key, result);
              if (html) {
                putPollHtml(card, html);
                // keep the numbers fresh while the page stays open: look again every minute
                const timer = setInterval(async () => {
                  if (!document.body.contains(card)) { clearInterval(timer); return; }
                  if (document.hidden) return;
                  try {
                    const r2 = await fetch(`${API_BASE_URL.replace(/\/$/, "")}/poll-results?promise=${encodeURIComponent(key)}`);
                    const res2 = r2.ok ? await r2.json() : null;
                    const box = card.querySelector(".pd-pr");
                    const fresh = res2 && res2.enough ? pollBars(res2, key) : "";
                    if (box && fresh) box.outerHTML = fresh;
                  } catch (_) {}
                }, 60000);
                return;
              }
            }
            lastError = "";
            if (!justVoted && pollCfg[key] && result && result.votes === 0 && document.body.contains(card)) { forgetVote(key); card.outerHTML = pollMarkupFor(key, false); return; }
            /* the Worker answered, but there are not enough votes to show yet: say so instead of "loading" */
            { const th = card.querySelector(".pd-poll-thanks"); if (th) th.textContent = result && typeof result.votes === "number" && result.votes > 0 && !result.enough && attempt >= 1 ? (justVoted ? "Bedankt voor je stem! De resultaten verschijnen zodra er genoeg stemmen zijn." : "De resultaten verschijnen zodra er genoeg stemmen zijn.") : waiting; }
          } catch (err) { lastError = err.message; }
        }
        if (lastError) console.warn("BRUZZCheck: poll-resultaten niet geladen:", lastError);
        /* own poll: this browser says "voted", but the database has no votes for this promise (e.g. they were cleared):
           forget the note and show the buttons again */
        if (pollCfg[key] && lastVotes === 0 && document.body.contains(card)) {
          forgetVote(key);
          card.outerHTML = pollMarkupFor(key, false);
        }
      }

      /* The poll card: the Tally form, or (after voting) a thank-you and the results. There is no way back to the form. */
      function pollMarkupFor(key, voted) {
        const label = POLL_LABEL ? `<p class="pd-poll-label">${escapeHtml(POLL_LABEL)}</p>` : "";
        if (voted) {
          return `
                  <div class="pd-poll pd-poll-done" aria-label="Poll" data-poll-key="${escapeHtml(key)}">
                    ${label}
                    ${(() => { const c = readPollCache(key); const h = c ? pollBars(c.result, key, c.t) : ""; return h || '<p class="pd-poll-thanks">Resultaten laden...</p>'; })()}
                  </div>`;
        }

      /* a dot of the round timeline brings you to that verdict in the timeline, and opens it */

      let turnstileLoad = null;

      /* the shown numbers with this reader's vote added (the server count follows a moment later) */
      function withOwnVote(result, key, answer) {
        const out = JSON.parse(JSON.stringify(result)), norm = t => String(t).trim().toLowerCase();
        const q = pollCfg[key] ? pollCfg[key].label : (POLL_QUESTIONS[0] && POLL_QUESTIONS[0].label);
        out.questions = out.questions || {};
        const label = Object.keys(out.questions).find(l => norm(l) === norm(q)) || q;
        const ans = out.questions[label] = out.questions[label] || {};
        const hit = Object.keys(ans).find(a => norm(a) === norm(answer)) || answer;

      if (card.href) {
        shell.href = card.href;
        shell.setAttribute("role", "link");
        shell.setAttribute("tabindex", "0");
        shell.setAttribute("aria-label", card.title);
      } else {
        shell.setAttribute("role", "article");
      }

      if (card.image) {
        const media = document.createElement("div");
        media.className = "teaser__media";

        const img = document.createElement("img");
        img.src = card.image;
        img.alt = card.imageAlt || "";
        img.loading = "lazy";

        media.appendChild(img);
        shell.appendChild(media);
      }

      const content = document.createElement("div");
      content.className = "teaser__content";

      shell.appendChild(content);
      wrapper.appendChild(shell);

    }

    function readFeedCard(item, index) {
      const meta = item.querySelector(".meta");
      const title = getFeedTitle(item);
      const dateInfo = getDateInfo(meta, item);

      /* "stub" teasers (e.g. "BRUZZ oordeelt: Gelukt 30/10/2026"): the status is read from the title,
         the date is read from the text and removed from the title */
      let stubTitle = title;
      let stub = null;

      if (item.querySelector(".teaser--type-stub")) {
        const inTitle = findDateInText(title);
        if (inTitle) stubTitle = tidyTitle(title.replace(inTitle.match, " "));
        const status = findStatus(stubTitle);
        if (status) stub = status;
      }

      return {
        id: "bm-timeline-feed-" + index,
        isManual: false,
        stub: stub,
        title: stubTitle,
        badge: getBadge(title),
        status: "",
        dateLabel: dateInfo.dateLabel,
        dateTimeLabel: dateInfo.dateTimeLabel,
        metaLine: stub ? dateInfo.dateLabel : getMetaLine(meta, dateInfo),
        dateMs: dateInfo.ms,
        href: getFeedHref(item),
        image: null,
        imageAlt: "",
        realized: Boolean(stub && stub.key === "GELUKT")
      };
    }

    function collectFeedPairs(sourceSections) {
      const seenHrefs = new Set();
      const pairs = [];
      let feedIndex = 0;

      sourceSections.forEach(function (section) {
        const list = section.querySelector(".teaser-section__items");
        if (!list) return;

        Array.from(list.children)
          .filter(function (child) {
            return child.matches("li");
          })
          .forEach(function (item) {
            const href = getFeedHref(item);

            if (config.dedupeByHref && href) {
              if (seenHrefs.has(href)) return;
              seenHrefs.add(href);
            }

            pairs.push({
              item: item,
              card: readFeedCard(item, feedIndex)
            });

            feedIndex++;
          });
      });

      return pairs;
    }

    function getTimelineRange(cards) {
      const dates = cards
        .map(function (card) { return card.dateMs; })
        .filter(function (ms) { return Number.isFinite(ms); });

      if (!dates.length) {
        const now = Date.now();

        return {
          startDate: now,
          endDate: now
        };
      }

      let startDate = Math.min.apply(null, dates);
      const endDate = Math.max.apply(null, dates);
      /* the overview starts on 1 February 2026, the older articles stay in the list but get no stripe */
      startDate = new Date(2026, 1, 1).getTime();

      return {
        startDate: startDate,
        endDate: endDate
      };
    }

    function getDotPositions(cards, startDate, endDate) {
      const totalRange = Math.max(1, endDate - startDate);

      const positions = cards.map(function (card, index) {
        let pos = 0;

        if (Number.isFinite(card.dateMs)) {
          pos = ((card.dateMs - startDate) / totalRange) * 100;
          pos = clamp(pos, 0, 100);
        }

        return {
          index: index,
          pos: pos
        };
      });

      const sorted = positions.slice().sort(function (a, b) {
        return a.pos - b.pos;
      });

      const minGap = 1.15;

      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i].pos - sorted[i - 1].pos < minGap) {
          sorted[i].pos = sorted[i - 1].pos + minGap;
        }
      }

      const overflow = sorted.length ? sorted[sorted.length - 1].pos - 100 : 0;

      if (overflow > 0) {
        sorted.forEach(function (item) {
          item.pos -= overflow;
        });
      }

      sorted.forEach(function (item) {
        item.pos = clamp(item.pos, 0, 100);
      });

      const result = [];

      sorted.forEach(function (item) {
        result[item.index] = item.pos;
      });

      return result;
    }


    /* ---- stripes view: a fine heatmap, one stripe per day / week / month; the colour is how many updates fall in it.
       Purely visual (no clicking); the assessments show as small coloured dots above their stripe. ---- */
    function buildStripesNav(section, cards, startDate, endDate) {
      const old = section.querySelector(".bm-stripes-nav"); if (old) old.remove();
      const oldSw = section.querySelector(".bm-view-switch"); if (oldSw) oldSw.remove();

      function floorTo(unit, ms) {
        const d = new Date(ms); d.setHours(0, 0, 0, 0);
        if (unit === "week") d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        if (unit === "month") d.setDate(1);
        if (unit === "quarter") { d.setDate(1); d.setMonth(d.getMonth() - (d.getMonth() % 3)); }
        if (unit === "year") { d.setDate(1); d.setMonth(0); }
        return d;
      }
      function addUnit(unit, d) {
        const x = new Date(d);
        if (unit === "day") x.setDate(x.getDate() + 1);
        else if (unit === "week") x.setDate(x.getDate() + 7);
        else if (unit === "month") x.setMonth(x.getMonth() + 1);
        else if (unit === "quarter") x.setMonth(x.getMonth() + 3);
        else x.setFullYear(x.getFullYear() + 1);
        return x;
      }
      function edgesFor(unit) {
        const edges = [];
        let d = floorTo(unit, startDate);
        edges.push(d.getTime());
        while (d.getTime() <= endDate && edges.length < 1200) { d = addUnit(unit, d); edges.push(d.getTime()); }
        return edges;
      }
      let unit = "week", edges = edgesFor(unit);
      const n = edges.length - 1;

      function bucketOf(ms) {
        if (!Number.isFinite(ms)) return -1;
        for (let i = 0; i < n; i++) if (ms >= edges[i] && ms < edges[i + 1]) return i;
        return -1;
      }
      const counts = new Array(n).fill(0);
      cards.forEach(function (c) { const b = bucketOf(c.dateMs); if (!c.stub && b >= 0) counts[b]++; });
      const max = Math.max(1, Math.max.apply(null, counts));

      const nav = document.createElement("div");
      nav.className = "bm-timeline-nav bm-stripes-nav";
      nav.setAttribute("role", "img");
      nav.setAttribute("aria-label", "Overzicht van het aantal updates in de tijd");

      const wrap = document.createElement("div"); wrap.className = "bm-stripes__wrap";
      const marks = document.createElement("div"); marks.className = "bm-stripes__marks";
      const bar = document.createElement("div"); bar.className = "bm-stripes";

      for (let i = 0; i < n; i++) {
        const b = document.createElement("span");
        b.className = "bm-stripe";
        b.dataset.n = String(counts[i]);
        b.style.setProperty("--a", counts[i] ? "1" : "0.16");
        bar.appendChild(b);
      }
      /* the stripes with articles jump to the first article of that week */
      const firstOf = new Array(n).fill(null);
      cards.slice().sort(function (a, b) { return a.dateMs - b.dateMs; }).forEach(function (c) {
        const bi = bucketOf(c.dateMs);
        if (!c.stub && bi >= 0 && !firstOf[bi]) firstOf[bi] = c.id;
      });
      Array.prototype.forEach.call(bar.children, function (b, i) { if (firstOf[i]) { b.dataset.target = firstOf[i]; b.setAttribute("role", "button"); b.setAttribute("tabindex", "0"); } });
      function goTo(id) {
        const target = document.getElementById(id);
        if (!target) return;
        section.querySelectorAll(".bm-timeline-active").forEach(function (item) { item.classList.remove("bm-timeline-active"); });
        target.classList.add("bm-timeline-active");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      nav.addEventListener("click", function (e) {
        const t = e.target.closest("[data-target]");
        if (t && nav.contains(t)) goTo(t.dataset.target);
      });
      nav.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        const t = e.target.closest && e.target.closest("[data-target]");
        if (t && nav.contains(t)) { e.preventDefault(); goTo(t.dataset.target); }
      });

      /* assessments: a line in the status colour with the status symbol above it and "Status 15 nov 2026" */
      const stw = document.createElement("div"); stw.className = "bm-st-wrap";
      const SYMX = window.BRUZZ_SYM || null;
      cards.forEach(function (card) {
        const bi = bucketOf(card.dateMs);
        if (!(card.stub && card.stub.conf && card.stub.conf.color) || bi < 0) return;
        const pos = (bi + 0.5) / n * 100;
        const col = SYMX ? SYMX.color(card.stub.conf) : card.stub.conf.color;
        const d = new Date(card.dateMs);
        const lab = "Status " + d.toLocaleDateString("nl-BE", { day: "numeric", month: "short", year: "numeric" }).replace(/\./g, "");
        const m = document.createElement("span");
        m.className = "bm-st" + (pos > 68 ? " bm-st--left" : "");
        m.style.left = pos + "%"; m.style.setProperty("--bm-st", col);
        m.innerHTML = '<span class="bm-st-top"><span class="bm-st-sym" data-target="' + card.id + '" title="' + lab + '">' + (SYMX ? SYMX.html(card.stub.conf) : "") + '</span></span><span class="bm-st-line"></span>';
        const blk = bar.children[bi];
        if (blk) { blk.classList.add("has-sym"); const sy = document.createElement("span"); sy.className = "bm-st-sym bm-st-sym--on"; sy.title = lab; sy.innerHTML = SYMX ? SYMX.html(card.stub.conf) : ""; blk.appendChild(sy); }
      });

      /* today */
      const nowMs = Date.now();
      if (nowMs >= edges[0] && nowMs < edges[n]) {
        const t = document.createElement("span"); t.className = "bm-stripes__today";
        t.style.left = ((nowMs - edges[0]) / (edges[n] - edges[0]) * 100) + "%";
        bar.appendChild(t);
      }

      function sizeSq() {
        const w = bar.clientWidth; if (!w) return;
        bar.style.setProperty("--sq", Math.max(3, Math.min(14, Math.floor((w - (n - 1)) / n))) + "px");
      }
      wrap.append(stw, marks, bar);
      requestAnimationFrame(sizeSq); setTimeout(sizeSq, 300); setTimeout(sizeSq, 1200);
      window.addEventListener("resize", sizeSq);
      const row = document.createElement("div");
      row.className = "bm-timeline-nav__row";
      const l = document.createElement("span"); l.className = "bm-timeline-nav__edge-label"; const monthYear = function (ms) { return new Date(ms).toLocaleDateString("nl-BE", { month: "short", year: "numeric" }).replace(/\./g, ""); };
      l.innerHTML = '<span class="bm-arr bm-arr--s" aria-hidden="true"></span>' + monthYear(startDate);
      const r = document.createElement("span"); r.className = "bm-timeline-nav__edge-label"; r.innerHTML = monthYear(endDate) + '<span class="bm-arr bm-arr--e" aria-hidden="true"></span>';
      row.append(l, wrap, r);
      nav.appendChild(row);

      const sectionTitle = section.querySelector(".section-title");
      const dotsNav = section.querySelector(".bm-timeline-nav:not(.bm-stripes-nav)");
      if (dotsNav) dotsNav.after(nav); else if (sectionTitle) sectionTitle.after(nav);
      section.classList.add("bm-view-stripes");

      /* hide the "Status ..." text of a marker when it would run into a more recent one */
      function fitLabels() {
        return;
        const marks = Array.prototype.slice.call(nav.querySelectorAll(".bm-st"));
        const box = nav.getBoundingClientRect();
        const syms = marks.map(function (m) { return m.querySelector(".bm-st-sym").getBoundingClientRect(); });
        const kept = [];
        const hit = function (r, skip) {
          return r.left < box.left || r.right > box.right ||
            kept.some(function (k) { return r.left < k.right + 8 && r.right > k.left - 8; }) ||
            syms.some(function (k, j) { return j !== skip && r.left < k.right + 4 && r.right > k.left - 4; });
        };
        marks.forEach(function (m) { const l = m.querySelector(".bm-st-lab"); l.style.visibility = ""; l.textContent = l.dataset.full; });
        for (let i = marks.length - 1; i >= 0; i--) {
          const m = marks[i], lab = m.querySelector(".bm-st-lab");
          if (!lab.getBoundingClientRect().width) continue;
          let ok = false;
          [lab.dataset.full, lab.dataset.short].forEach(function (txt) {
            if (ok) return;
            lab.textContent = txt;
            for (let t = 0; t < 2 && !ok; t++) {
              const r = lab.getBoundingClientRect();
              if (!hit(r, i)) { ok = true; kept.push(r); } else m.classList.toggle("bm-st--left");
            }
          });
          if (!ok) { lab.textContent = lab.dataset.full; lab.style.visibility = "hidden"; }
        }
      }
      requestAnimationFrame(fitLabels);
      setTimeout(fitLabels, 400);
      window.addEventListener("resize", function () { requestAnimationFrame(fitLabels); });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);
    }

    function buildTimelineNav(section, cards) {
      const oldNav = section.querySelector(".bm-timeline-nav");
      if (oldNav) oldNav.remove();

      const range = getTimelineRange(cards);
      const startDate = range.startDate;
      const endDate = range.endDate;
      const dotPositions = getDotPositions(cards, startDate, endDate);

      const nav = document.createElement("div");
      nav.className = "bm-timeline-nav";

      const track = document.createElement("div");
      track.className = "bm-timeline-nav__track";

      /* the part of the timeline that has already happened (up to today) is coloured pink */
      const startMs = new Date(startDate).getTime();
      const endMs = new Date(endDate).getTime();
      if (endMs > startMs) {
        const done = Math.min(100, Math.max(0, (Date.now() - startMs) / (endMs - startMs) * 100));
        const fill = document.createElement("span");
        fill.className = "bm-timeline-nav__fill";
        fill.style.width = done + "%";
        track.appendChild(fill);
      }

      cards.forEach(function (card, index) {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "bm-timeline-nav__dot";

        if (card.badge === "MILESTONE") {
          dot.classList.add("bm-timeline-nav__dot--milestone");
        }

        if (card.badge === "VONNIS") {
          dot.classList.add("bm-timeline-nav__dot--vonnis");
        }

        if (card.realized) {
          dot.classList.add("bm-timeline-nav__dot--realized");
        }

        if (card.stub && card.stub.conf && card.stub.conf.color) {
          dot.classList.add("bm-timeline-nav__dot--status");
          dot.style.setProperty("--bm-dot-color", card.stub.conf.color);
        }

        dot.style.left = dotPositions[index] + "%";
        /* the most recent dot (furthest right) lies on top of the earlier ones */
        dot.style.zIndex = String(2 + Math.round(dotPositions.filter(function (p, k) { return p < dotPositions[index] || (p === dotPositions[index] && k < index); }).length));
        dot.title = clean(card.dateLabel + " — " + card.title);
        dot.setAttribute("aria-label", dot.title);

        dot.addEventListener("click", function () {
          const target = document.getElementById(card.id);
          if (!target) return;

          section.querySelectorAll(".bm-timeline-nav__dot--active").forEach(function (item) {
            item.classList.remove("bm-timeline-nav__dot--active");
          });
          dot.classList.add("bm-timeline-nav__dot--active");

          section.querySelectorAll(".bm-timeline-active").forEach(function (item) {
            item.classList.remove("bm-timeline-active");
          });
          target.classList.add("bm-timeline-active");

          target.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });
        });

        track.appendChild(dot);
      });

      const row = document.createElement("div");
      row.className = "bm-timeline-nav__row";

      const leftLabel = document.createElement("span");
      leftLabel.className = "bm-timeline-nav__edge-label";

      const rightLabel = document.createElement("span");
      rightLabel.className = "bm-timeline-nav__edge-label";

      leftLabel.textContent = formatDate(startDate);
      rightLabel.textContent = formatDate(endDate);

      row.append(leftLabel, track, rightLabel);
      nav.appendChild(row);

      const sectionTitle = section.querySelector(".section-title");
      if (sectionTitle) {
        sectionTitle.after(nav);
      }

      try { buildStripesNav(section, cards, startDate, endDate); } catch (err) { console.warn("stripes:", err && err.message); }
    }

    /* A verdict card ("Oordeel van BRUZZ"): a slim bar in the status colour with icon, status and date.
       When there is a toelichting the bar is a button that opens and closes the text underneath. */
    function renderStubItem(item, content, originalMedia, titleEl, card, isLinked) {
